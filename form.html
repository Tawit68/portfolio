<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styleform.css">
</head>
<body>

    <div class="container">
        <header class="head">
            <div class="name">
                <div>
                    <div class="name-title">Tawit K.</div>
                    <div class="name-subtitle"> PORTFOLIO</div>
                </div>
            </div>
            
            <nav>
                <ul>
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="history.html">ประวัติ</a></li>
                    <li><a href="skill.html">ทักษะ</a></li>
                    <li><a href="Project.html">ผลงาน</a></li>
                    <li><a href="form.html">ติดต่อ</a></li>
                </ul>
            </nav>
        </header>
        <div class="section-header">
            <h1 class="section-title">ติดต่อพูดคุย</h1>
            <p class="section-subtitle">สนใจในDevตัวน้อยคนนี้ กรุณาติดต่อได้ด้านล่างเลยครับ</p>
        </div>

        <article class="contact-grid">

            <div class="card">
                <div class="contact-info-list">
                    <h2 class="form-title">ช่องทางการติดต่อ</h2>
                    
                    <div class="contact-item">
                        <div class="contact-icon">📧</div>
                        <div class="contact-details">
                            <h3>Email</h3>
                            <a href="#">684259011@webmail.npru.ac.th</a>
                        </div>
                    </div>

                    <div class="contact-item">
                        <div class="contact-icon">💻</div>
                        <div class="contact-details">
                            <h3>GitHub</h3>
                            <a href="#">github.com/TawitTa</a>
                        </div>
                    </div>


                    <div class="contact-item">
                        <div class="contact-icon">📱</div>
                        <div class="contact-details">
                            <h3>phone</h3>
                            <a href="#">0624359033</a>
                        </div>
                    </div>

                </div>
            </div>

            <div class="card">
                <h2 class="form-title">ส่งข้อความถึงผม </h2>
                
                <form action="#" method="POST">
                    
                    <div class="form-group">
                        <label class="form-label" for="name">ชื่อ - นามสกุล</label>
                        <input type="text" id="name" class="form-control" placeholder="ระบุชื่อ">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">อีเมลติดต่อกลับ</label>
                        <input type="email" id="email" class="form-control" placeholder="ชื่ออีเมลล์@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="subject">หัวข้อที่ต้องการติดต่อ</label>
                        <input type="text" id="subject" class="form-control" placeholder="เช่น สนใจจ้างไปนอนกินเงินเดือน">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="message">ข้อความ</label>
                        <input type="message" class="form-control" placeholder="พิมพ์ข้อความของ"></input>
                    </div>

                    <button type="submit" class="submit-btn">
                        ส่งข้อความ 🚀
                    </button>
                    
                </form>
            </div>

        </article>

        
    </div>
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Tawit Keawwan</p>
        </div>
    </footer>
